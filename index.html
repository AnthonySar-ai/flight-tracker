<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Price Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #0f1f3d;
    --navy-light: #1a2f55;
    --green: #0f6e56;
    --green-light: #e6f4f0;
    --blue: #1e5ba8;
    --blue-light: #e8f0fb;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --red: #dc2626;
    --amber: #d97706;
    --price-low: #0f6e56;
    --price-high: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* TOPBAR */
  #topbar {
    background: var(--navy);
    color: white;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
  #topbar h1 span { color: #4ade80; }
  #last-run {
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
  }
  #refresh-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  #refresh-btn:hover { background: #0a5a45; }

  /* LAYOUT */
  .main { max-width: 1400px; margin: 0 auto; padding: 20px 20px 40px; }

  /* SPINNER */
  #spinner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 16px;
  }
  .spin {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #spinner p { color: var(--muted); font-size: 14px; }

  /* ERROR */
  #error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 20px;
    color: #991b1b;
    margin: 20px 0;
    display: none;
  }

  /* STATS BAR */
  #stats-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
  }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* INSIGHT CARDS */
  #insights {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .insight {
    background: var(--card);
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
  }
  .insight.warn { border-left-color: var(--amber); }
  .insight.good { border-left-color: var(--green); }
  .insight.info { border-left-color: var(--blue); }
  .insight .i-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .insight .i-value { font-size: 15px; font-weight: 700; }
  .insight .i-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* SEASON TABS */
  #season-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stab {
    padding: 7px 18px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.15s;
  }
  .stab.active { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .stab.decjan { }
  .stab.decjan.active { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

  /* CARD */
  .card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* CHARTS GRID */
  .charts-row {
    display: grid;
    gap: 16px;
    margin-bottom: 16px;
  }
  .charts-2 { grid-template-columns: 1fr 1fr; }
  .charts-1 { grid-template-columns: 1fr; }

  /* DATE TOGGLES */
  .toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .dtog {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.12s;
  }
  .dtog.active { border-color: var(--green); color: white; background: var(--green); }
  .dtog.active.decjan { border-color: var(--blue); background: var(--blue); }

  /* HEATMAP */
  #heatmap-wrap { overflow-x: auto; }
  #heatmap-table {
    border-collapse: collapse;
    font-size: 11px;
    min-width: 100%;
  }
  #heatmap-table th {
    padding: 4px 8px;
    text-align: center;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
    background: white;
    position: sticky;
    top: 0;
  }
  #heatmap-table td {
    padding: 6px 10px;
    text-align: center;
    border: 1px solid #f3f4f6;
    font-weight: 700;
    border-radius: 4px;
  }
  #heatmap-table .row-label {
    text-align: left;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    padding-right: 14px;
    font-size: 12px;
  }

  /* TABLE */
  #table-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    align-items: center;
  }
  .filter-select, .filter-input {
    padding: 6px 10px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    color: var(--text);
    background: white;
    outline: none;
    transition: border-color 0.12s;
  }
  .filter-select:focus, .filter-input:focus { border-color: var(--green); }
  .sort-btn {
    padding: 6px 12px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.12s;
  }
  .sort-btn.active { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .clear-btn {
    padding: 6px 12px;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  #offers-table-wrap { overflow-x: auto; }
  #offers-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  #offers-table thead th {
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    background: white;
    position: sticky;
    top: 0;
  }
  #offers-table tbody tr:hover { background: #fafafa; }
  #offers-table tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    vertical-align: middle;
  }

  /* PILLS */
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
  }
  .pill-aug { background: #fef3c7; color: #92400e; }
  .pill-dec { background: var(--blue-light); color: var(--blue); }
  .pill-direct { background: #dcfce7; color: #166534; }
  .pill-1stop { background: #fef3c7; color: #92400e; }
  .pill-2stop { background: #fee2e2; color: #991b1b; }

  .price-low-text { color: var(--price-low); font-weight: 700; }
  .price-high-text { color: var(--price-high); font-weight: 700; }
  .price-normal { font-weight: 600; }

  .chg-up { color: var(--red); font-weight: 700; }
  .chg-dn { color: var(--green); font-weight: 700; }
  .chg-neu { color: var(--muted); }

  .flight-chip {
    display: inline-block;
    background: #f3f4f6;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    margin: 1px 2px;
    color: var(--navy);
  }

  #table-count {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }

  /* CANVAS */
  .chart-container { position: relative; width: 100%; }

  /* AIRLINES CHARTS */
  .airlines-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    #stats-bar { grid-template-columns: repeat(3, 1fr); }
    #insights { grid-template-columns: 1fr; }
    .charts-2, .airlines-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    #stats-bar { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 12px 12px 32px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <h1>✈ Flight <span>Tracker</span></h1>
  <div id="last-run">Loading…</div>
  <button id="refresh-btn" onclick="loadData()">↻ Refresh</button>
</div>

<div class="main">
  <div id="spinner"><div class="spin"></div><p>Fetching latest prices…</p></div>
  <div id="error-box"></div>
  <div id="dashboard" style="display:none"></div>
</div>

<script>
const CSV_URL = 'https://raw.githubusercontent.com/AnthonySar-ai/flight-tracker/main/data/flights.csv';

// ── helpers ──────────────────────────────────────────────────────────────────

function fmtDate(str) {
  if (!str) return '—';
  const d = str.split(' ')[0]; // strip time if present
  const [y, m, day] = d.split('-');
  if (!y || !m || !day) return str;
  return `${day}-${m}-${y}`;
}

function fmtTime(str) {
  if (!str) return '—';
  const parts = str.trim().split(' ');
  const t = parts.length > 1 ? parts[1] : parts[0];
  return t.substring(0, 5);
}

function fmtMins(mins) {
  if (!mins || isNaN(mins)) return '—';
  const h = Math.floor(mins / 60), m = mins % 60;
  return `${h}h${String(m).padStart(2,'0')}`;
}

function parseRow(cells) {
  const n = cells.length;
  if (n >= 20) {
    // new format (25 cols)
    return {
      checked_at: cells[0], season: cells[1],
      depart_date: cells[2], return_date: cells[3],
      price_eur: parseFloat(cells[4]) || 0,
      airlines: cells[5], out_flight_nums: cells[6],
      out_stops: parseInt(cells[7]) || 0,
      out_dep_time: cells[8], out_arr_time: cells[9],
      out_duration: parseInt(cells[10]) || 0,
      out_duration_fmt: cells[11],
      out_layover_min: parseInt(cells[12]) || 0,
      out_layover_fmt: cells[13],
      ret_airlines: cells[14], ret_flight_nums: cells[15],
      ret_stops: parseInt(cells[16]) || 0,
      ret_dep_time: cells[17], ret_arr_time: cells[18],
      ret_duration: parseInt(cells[19]) || 0,
      ret_duration_fmt: cells[20],
      ret_layover_min: parseInt(cells[21]) || 0,
      ret_layover_fmt: cells[22],
      airline_count: parseInt(cells[23]) || 1,
      price_change_pct: parseFloat(cells[24]) || null,
      format: 'new'
    };
  } else {
    // old format (14 or 16 cols)
    return {
      checked_at: cells[0], season: cells[1],
      depart_date: cells[2], return_date: cells[3],
      price_eur: parseFloat(cells[4]) || 0,
      airlines: cells[5],
      out_flight_nums: '',
      out_stops: parseInt(cells[6]) || 0,
      out_dep_time: cells[7], out_arr_time: cells[8],
      out_duration: parseInt(cells[9]) || 0,
      out_duration_fmt: '',
      out_layover_min: 0, out_layover_fmt: '',
      ret_stops: parseInt(cells[10]) || 0,
      ret_dep_time: cells[11], ret_arr_time: cells[12],
      ret_duration: parseInt(cells[13]) || 0,
      ret_duration_fmt: '', ret_layover_min: 0, ret_layover_fmt: '',
      airline_count: n >= 15 ? (parseInt(cells[14]) || 1) : 1,
      price_change_pct: n >= 16 ? (parseFloat(cells[15]) || null) : null,
      format: 'old'
    };
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cells = splitCSVLine(line);
    if (cells.length < 5) continue;
    try { rows.push(parseRow(cells)); } catch(e) {}
  }
  return rows;
}

function splitCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  result.push(cur.trim());
  return result;
}

// ── colour helpers ────────────────────────────────────────────────────────────

function heatColor(val, min, max) {
  if (val == null) return '#f9fafb';
  const t = max === min ? 0.5 : (val - min) / (max - min);
  // green → yellow → red
  const r = Math.round(t < 0.5 ? 2 * t * 255 : 255);
  const g = Math.round(t < 0.5 ? 200 : (1 - t) * 2 * 200);
  const b = 80;
  return `rgba(${r},${g},${b},0.25)`;
}

// ── main render ───────────────────────────────────────────────────────────────

let allRows = [], activeSeason = 'all', activeTableDates = new Set();
let tableSort = 'price', tableAirline = '', tableStops = 'any', tableFlightSearch = '';
let charts = {};

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};
}

async function loadData() {
  document.getElementById('spinner').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('error-box').style.display = 'none';
  destroyCharts();

  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    allRows = parseCSV(text);
    if (!allRows.length) throw new Error('No data rows found');

    const lastDate = allRows.map(r => r.checked_at).sort().pop();
    document.getElementById('last-run').textContent = '↺ Last run: ' + fmtDate(lastDate);

    render();
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    const eb = document.getElementById('error-box');
    eb.style.display = 'block';
    eb.innerHTML = `<strong>Could not load data.</strong> ${e.message}<br><small>Check the CSV URL or network settings.</small>`;
  }
}

function filteredRows() {
  return allRows.filter(r => {
    if (activeSeason === 'august' && r.season !== 'August') return false;
    if (activeSeason === 'decjan' && r.season !== 'DecJan') return false;
    return true;
  });
}

function render() {
  const rows = filteredRows();
  const dash = document.getElementById('dashboard');
  dash.innerHTML = buildHTML(rows);
  attachEvents(rows);
  buildCharts(rows);
  renderTable(rows);
}

function buildHTML(rows) {
  const prices = rows.map(r => r.price_eur);
  const cheapest = Math.min(...prices);
  const cheapestRow = rows.find(r => r.price_eur === cheapest);
  const avg = prices.reduce((a,b) => a+b, 0) / prices.length;
  const weeks = new Set(rows.map(r => r.checked_at)).size;
  const airlines = new Set(rows.flatMap(r => r.airlines.split(',').map(a => a.trim()))).size;

  // insight 1: trend (last 2 "check weeks")
  const sortedWeeks = [...new Set(rows.map(r => r.checked_at))].sort();
  let trendText = 'Stable', trendClass = 'info';
  if (sortedWeeks.length >= 2) {
    const lastW = sortedWeeks[sortedWeeks.length - 1];
    const prevW = sortedWeeks[sortedWeeks.length - 2];
    const lastMin = Math.min(...rows.filter(r => r.checked_at === lastW).map(r => r.price_eur));
    const prevMin = Math.min(...rows.filter(r => r.checked_at === prevW).map(r => r.price_eur));
    const diff = ((lastMin - prevMin) / prevMin) * 100;
    if (diff > 3) { trendText = `↑ Rising (+${diff.toFixed(1)}%)`; trendClass = 'warn'; }
    else if (diff < -3) { trendText = `↓ Falling (${diff.toFixed(1)}%)`; trendClass = 'good'; }
  }

  // insight 2: biggest price drop per depart date
  const byDepart = {};
  rows.forEach(r => {
    if (!byDepart[r.depart_date]) byDepart[r.depart_date] = [];
    byDepart[r.depart_date].push(r);
  });
  let biggestDrop = null, biggestDropDate = '', biggestDropPct = 0;
  Object.entries(byDepart).forEach(([d, drows]) => {
    const ws = [...new Set(drows.map(r => r.checked_at))].sort();
    if (ws.length < 2) return;
    const first = Math.min(...drows.filter(r => r.checked_at === ws[0]).map(r => r.price_eur));
    const last = Math.min(...drows.filter(r => r.checked_at === ws[ws.length-1]).map(r => r.price_eur));
    const pct = ((last - first) / first) * 100;
    if (pct < biggestDropPct) { biggestDropPct = pct; biggestDropDate = d; biggestDrop = last; }
  });

  // insight 3: rising price date
  let risingDate = '', risingPct = 0;
  Object.entries(byDepart).forEach(([d, drows]) => {
    const ws = [...new Set(drows.map(r => r.checked_at))].sort();
    if (ws.length < 2) return;
    const first = Math.min(...drows.filter(r => r.checked_at === ws[0]).map(r => r.price_eur));
    const last = Math.min(...drows.filter(r => r.checked_at === ws[ws.length-1]).map(r => r.price_eur));
    const pct = ((last - first) / first) * 100;
    if (pct > risingPct) { risingPct = pct; risingDate = d; }
  });

  const isDecJan = d => d && (d.includes('-12-') || d.includes('-01-') || d.startsWith('2027'));

  return `
  <!-- STATS BAR -->
  <div id="stats-bar">
    <div class="stat-card">
      <div class="label">Cheapest ever</div>
      <div class="value" style="color:var(--green)">€${cheapest.toFixed(0)}</div>
      <div class="sub">${cheapestRow ? cheapestRow.airlines.split(',')[0].trim() : '—'}</div>
    </div>
    <div class="stat-card">
      <div class="label">Average price</div>
      <div class="value">€${avg.toFixed(0)}</div>
      <div class="sub">all offers</div>
    </div>
    <div class="stat-card">
      <div class="label">Weeks tracked</div>
      <div class="value">${weeks}</div>
      <div class="sub">check runs</div>
    </div>
    <div class="stat-card">
      <div class="label">Total offers</div>
      <div class="value">${rows.length.toLocaleString()}</div>
      <div class="sub">collected</div>
    </div>
    <div class="stat-card">
      <div class="label">Airlines seen</div>
      <div class="value">${airlines}</div>
      <div class="sub">unique carriers</div>
    </div>
  </div>

  <!-- INSIGHTS -->
  <div id="insights">
    <div class="insight ${trendClass}">
      <div class="i-label">Current trend</div>
      <div class="i-value">${trendText}</div>
      <div class="i-sub">Based on last 2 check dates</div>
    </div>
    <div class="insight good">
      <div class="i-label">Biggest price drop</div>
      <div class="i-value">${biggestDropDate ? fmtDate(biggestDropDate) + ' — ' + biggestDropPct.toFixed(1) + '%' : 'Not enough data'}</div>
      <div class="i-sub">${biggestDrop ? 'Now €' + biggestDrop.toFixed(0) : ''}</div>
    </div>
    <div class="insight warn">
      <div class="i-label">Rising prices ⚠</div>
      <div class="i-value">${risingDate ? fmtDate(risingDate) : 'None detected'}</div>
      <div class="i-sub">${risingDate ? '+' + risingPct.toFixed(1) + '% since first check' : ''}</div>
    </div>
  </div>

  <!-- SEASON TABS -->
  <div id="season-tabs">
    <button class="stab ${activeSeason === 'all' ? 'active' : ''}" data-season="all">All seasons</button>
    <button class="stab ${activeSeason === 'august' ? 'active' : ''}" data-season="august">☀ August</button>
    <button class="stab decjan ${activeSeason === 'decjan' ? 'active' : ''}" data-season="decjan">🎄 Dec/Jan</button>
  </div>

  <!-- CHART 1: PRICE TREND -->
  <div class="card">
    <h2>Price trend <span class="badge">cheapest per week</span></h2>
    <div class="toggle-row" id="trend-toggles"></div>
    <div class="chart-container" style="height:280px">
      <canvas id="chart-trend"></canvas>
    </div>
  </div>

  <!-- CHART 2: HEATMAP -->
  <div class="card">
    <h2>Price heatmap <span class="badge">cheapest price per week</span></h2>
    <div id="heatmap-wrap"><div id="heatmap-content"></div></div>
  </div>

  <!-- CHARTS 3 & 4 -->
  <div class="charts-row charts-2">
    <div class="card" style="margin-bottom:0">
      <h2>Price range <span class="badge">min / avg / max per depart date</span></h2>
      <div class="chart-container" style="height:260px">
        <canvas id="chart-range"></canvas>
      </div>
    </div>
    <div class="card" style="margin-bottom:0">
      <h2>Best time to book <span class="badge">avg price vs weeks before departure</span></h2>
      <div class="chart-container" style="height:260px">
        <canvas id="chart-timing"></canvas>
      </div>
    </div>
  </div>
  <div style="margin-bottom:16px"></div>

  <!-- CHART 5: AIRLINES -->
  <div class="card">
    <h2>Airlines</h2>
    <div class="airlines-grid">
      <div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600">Average price per airline</div>
        <div class="chart-container" style="height:240px"><canvas id="chart-airline-avg"></canvas></div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600">Times cheapest per airline</div>
        <div class="chart-container" style="height:240px"><canvas id="chart-airline-cheapest"></canvas></div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h2>All collected offers</h2>
    <div id="table-filters">
      <!-- date toggles injected here -->
      <div class="toggle-row" id="table-date-toggles" style="margin-bottom:0;flex:100%"></div>
      <select class="filter-select" id="f-airline"><option value="">All airlines</option></select>
      <select class="filter-select" id="f-stops">
        <option value="any">Any stops</option>
        <option value="direct">Direct only</option>
        <option value="1">1 stop</option>
        <option value="2">2+ stops</option>
      </select>
      <input class="filter-input" id="f-flight" placeholder="Flight no. search" style="width:160px">
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--muted);font-weight:600">Sort:</span>
        <button class="sort-btn ${tableSort==='price'?'active':''}" data-sort="price">Price</button>
        <button class="sort-btn ${tableSort==='depart'?'active':''}" data-sort="depart">Dep date</button>
        <button class="sort-btn ${tableSort==='week'?'active':''}" data-sort="week">Week</button>
        <button class="sort-btn ${tableSort==='duration'?'active':''}" data-sort="duration">Duration</button>
      </div>
      <button class="clear-btn" id="clear-filters">✕ Clear</button>
      <span id="table-count"></span>
    </div>
    <div id="offers-table-wrap">
      <table id="offers-table">
        <thead>
          <tr>
            <th>Week</th><th>Season</th><th>Depart</th><th>Return</th>
            <th>Price €</th><th>Chg</th><th>Airline(s)</th><th>Flight nos.</th>
            <th>Stops</th>
            <th>Out dep</th><th>Out arr</th><th>Out duration</th><th>Out layover</th>
            <th>Ret stops</th><th>Ret dep</th><th>Ret arr</th><th>Ret duration</th><th>Ret layover</th>
          </tr>
        </thead>
        <tbody id="offers-tbody"></tbody>
      </table>
    </div>
  </div>
  `;
}

function attachEvents(rows) {
  // season tabs
  document.querySelectorAll('.stab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSeason = btn.dataset.season;
      activeTableDates = new Set();
      tableAirline = ''; tableStops = 'any'; tableFlightSearch = '';
      destroyCharts();
      render();
    });
  });

  // trend toggles — build from data
  const datesForTrend = [...new Set(filteredRows().map(r => r.depart_date))].sort();
  const toggleRow = document.getElementById('trend-toggles');
  const isDecJan = d => d && (d.includes('-12-') || d.includes('-01-') || d.startsWith('2027') || (d.split('-')[1] === '01'));
  datesForTrend.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'dtog' + (isDecJan(d) ? ' decjan' : '');
    btn.dataset.date = d;
    btn.textContent = fmtDate(d);
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      buildTrendChart(filteredRows());
    });
    toggleRow.appendChild(btn);
  });

  // table date toggles
  const tableDateRow = document.getElementById('table-date-toggles');
  datesForTrend.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'dtog' + (isDecJan(d) ? ' decjan' : '');
    btn.dataset.tdate = d;
    btn.textContent = fmtDate(d);
    if (activeTableDates.has(d)) btn.classList.add('active');
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      if (activeTableDates.has(d)) activeTableDates.delete(d);
      else activeTableDates.add(d);
      renderTable(filteredRows());
    });
    tableDateRow.appendChild(btn);
  });

  // airline dropdown
  const airlineSet = new Set(rows.flatMap(r => r.airlines.split(',').map(a => a.trim())));
  const sel = document.getElementById('f-airline');
  [...airlineSet].sort().forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    if (a === tableAirline) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { tableAirline = sel.value; renderTable(filteredRows()); });

  document.getElementById('f-stops').value = tableStops;
  document.getElementById('f-stops').addEventListener('change', e => { tableStops = e.target.value; renderTable(filteredRows()); });

  document.getElementById('f-flight').value = tableFlightSearch;
  document.getElementById('f-flight').addEventListener('input', e => { tableFlightSearch = e.target.value; renderTable(filteredRows()); });

  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      tableSort = btn.dataset.sort;
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderTable(filteredRows());
    });
  });

  document.getElementById('clear-filters').addEventListener('click', () => {
    tableAirline = ''; tableStops = 'any'; tableFlightSearch = ''; tableSort = 'price'; activeTableDates = new Set();
    document.getElementById('f-airline').value = '';
    document.getElementById('f-stops').value = 'any';
    document.getElementById('f-flight').value = '';
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === 'price'));
    document.querySelectorAll('[data-tdate]').forEach(b => b.classList.remove('active'));
    renderTable(filteredRows());
  });
}

// ── CHARTS ────────────────────────────────────────────────────────────────────

const GREEN = '#0f6e56', BLUE = '#1e5ba8';
const PALETTE = ['#0f6e56','#1e5ba8','#d97706','#7c3aed','#dc2626','#0891b2','#65a30d','#db2777','#ea580c','#0284c7'];

function buildCharts(rows) {
  buildTrendChart(rows);
  buildHeatmap(rows);
  buildRangeChart(rows);
  buildTimingChart(rows);
  buildAirlineCharts(rows);
}

function buildTrendChart(rows) {
  if (charts['trend']) { charts['trend'].destroy(); delete charts['trend']; }

  const activeDates = [...document.querySelectorAll('.dtog.active')].map(b => b.dataset.date).filter(Boolean);
  if (!activeDates.length) {
    // pick first date
    const firstBtn = document.querySelector('.dtog[data-date]');
    if (firstBtn) { firstBtn.classList.add('active'); activeDates.push(firstBtn.dataset.date); }
  }

  const allWeeks = [...new Set(rows.map(r => r.checked_at))].sort();
  const isDecJan = d => d && (d.includes('-12-') || d.includes('-01-') || d.startsWith('2027') || (d.split('-')[1]==='01'));

  const datasets = activeDates.map((d, i) => {
    const data = allWeeks.map(w => {
      const matching = rows.filter(r => r.checked_at === w && r.depart_date === d);
      return matching.length ? Math.min(...matching.map(r => r.price_eur)) : null;
    });
    const col = isDecJan(d) ? PALETTE[i % PALETTE.length] : PALETTE[i % PALETTE.length];
    return {
      label: fmtDate(d),
      data, borderColor: col, backgroundColor: col + '22',
      pointRadius: 4, pointHoverRadius: 6,
      tension: 0.3, spanGaps: true, fill: false, borderWidth: 2
    };
  });

  const ctx = document.getElementById('chart-trend');
  if (!ctx) return;
  charts['trend'] = new Chart(ctx, {
    type: 'line',
    data: { labels: allWeeks.map(fmtDate), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 12 } } },
                 tooltip: { callbacks: { label: ctx => `€${ctx.parsed.y}` } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { ticks: { callback: v => '€' + v, font: { size: 11 } }, grid: { color: '#f3f4f6' } }
      }
    }
  });
}

function buildHeatmap(rows) {
  const departures = [...new Set(rows.map(r => r.depart_date))].sort();
  const weeks = [...new Set(rows.map(r => r.checked_at))].sort();

  // build min price matrix
  const matrix = {};
  departures.forEach(d => {
    matrix[d] = {};
    weeks.forEach(w => {
      const matching = rows.filter(r => r.depart_date === d && r.checked_at === w);
      matrix[d][w] = matching.length ? Math.min(...matching.map(r => r.price_eur)) : null;
    });
  });

  const allVals = Object.values(matrix).flatMap(row => Object.values(row).filter(v => v != null));
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);

  let html = '<div id="heatmap-wrap"><table id="heatmap-table"><thead><tr><th class="row-label">Departure</th>';
  weeks.forEach(w => { html += `<th>${fmtDate(w)}</th>`; });
  html += '</tr></thead><tbody>';
  departures.forEach(d => {
    html += `<tr><td class="row-label">${fmtDate(d)}</td>`;
    weeks.forEach(w => {
      const v = matrix[d][w];
      const bg = heatColor(v, minV, maxV);
      html += v != null
        ? `<td style="background:${bg}">€${v.toFixed(0)}</td>`
        : '<td style="color:#d1d5db">—</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('heatmap-content').innerHTML = html;
}

function buildRangeChart(rows) {
  const departures = [...new Set(rows.map(r => r.depart_date))].sort();
  const mins = [], avgs = [], maxs = [];
  departures.forEach(d => {
    const ps = rows.filter(r => r.depart_date === d).map(r => r.price_eur);
    mins.push(Math.min(...ps));
    avgs.push(ps.reduce((a,b)=>a+b,0)/ps.length);
    maxs.push(Math.max(...ps));
  });

  const ctx = document.getElementById('chart-range');
  if (!ctx) return;
  charts['range'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: departures.map(fmtDate),
      datasets: [
        { label: 'Min', data: mins, backgroundColor: '#0f6e5688', borderColor: GREEN, borderWidth: 1.5, borderRadius: 4 },
        { label: 'Avg', data: avgs, backgroundColor: '#1e5ba888', borderColor: BLUE, borderWidth: 1.5, borderRadius: 4 },
        { label: 'Max', data: maxs, backgroundColor: '#dc262644', borderColor: '#dc2626', borderWidth: 1.5, borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                 tooltip: { callbacks: { label: ctx => `€${ctx.parsed.y.toFixed(0)}` } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { ticks: { callback: v => '€' + v, font: { size: 11 } }, grid: { color: '#f3f4f6' } }
      }
    }
  });
}

function buildTimingChart(rows) {
  // for each row, compute weeks before departure
  const points = {};
  rows.forEach(r => {
    const dep = new Date(r.depart_date);
    const chk = new Date(r.checked_at);
    const wksBefore = Math.round((dep - chk) / (7 * 86400000));
    if (wksBefore < 0 || wksBefore > 52) return;
    if (!points[wksBefore]) points[wksBefore] = [];
    points[wksBefore].push(r.price_eur);
  });

  const sortedWks = Object.keys(points).map(Number).sort((a,b) => b - a);
  const labels = sortedWks.map(w => w === 0 ? 'This week' : `${w}w before`);
  const data = sortedWks.map(w => {
    const ps = points[w];
    return ps.reduce((a,b)=>a+b,0)/ps.length;
  });

  const ctx = document.getElementById('chart-timing');
  if (!ctx) return;
  charts['timing'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Avg price',
        data, borderColor: BLUE, backgroundColor: BLUE + '15',
        fill: true, tension: 0.3, pointRadius: 3, borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
                 tooltip: { callbacks: { label: ctx => `€${ctx.parsed.y.toFixed(0)}` } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 12 } },
        y: { ticks: { callback: v => '€' + v, font: { size: 11 } }, grid: { color: '#f3f4f6' } }
      }
    }
  });
}

function buildAirlineCharts(rows) {
  // parse airline from airlines field (can be "A, B")
  const airlineData = {};
  rows.forEach(r => {
    const als = r.airlines.split(',').map(a => a.trim()).filter(Boolean);
    const primary = als[0] || 'Unknown';
    if (!airlineData[primary]) airlineData[primary] = { prices: [], cheapestCount: 0 };
    airlineData[primary].prices.push(r.price_eur);
  });

  // cheapest per depart_date + checked_at
  const groups = {};
  rows.forEach(r => {
    const k = r.depart_date + '|' + r.checked_at;
    if (!groups[k] || r.price_eur < groups[k].price) groups[k] = { price: r.price_eur, airline: r.airlines.split(',')[0].trim() };
  });
  Object.values(groups).forEach(g => {
    if (airlineData[g.airline]) airlineData[g.airline].cheapestCount++;
  });

  const sorted = Object.entries(airlineData).sort((a,b) => {
    return (b[1].prices.reduce((x,y)=>x+y,0)/b[1].prices.length) - (a[1].prices.reduce((x,y)=>x+y,0)/a[1].prices.length);
  });
  const labels = sorted.map(([k]) => k);
  const avgPrices = sorted.map(([,v]) => Math.round(v.prices.reduce((a,b)=>a+b,0)/v.prices.length));
  const cheapestCounts = sorted.map(([,v]) => v.cheapestCount);

  const ctx1 = document.getElementById('chart-airline-avg');
  if (ctx1) {
    charts['airline-avg'] = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels,
        datasets: [{ label: 'Avg price', data: avgPrices,
          backgroundColor: labels.map((_,i) => PALETTE[i % PALETTE.length] + 'cc'),
          borderRadius: 5, borderSkipped: false }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `€${c.parsed.x}` } } },
        scales: { x: { ticks: { callback: v => '€'+v, font: { size: 11 } }, grid: { color: '#f3f4f6' } },
                  y: { ticks: { font: { size: 11 } }, grid: { display: false } } }
      }
    });
  }

  const sortedByCount = Object.entries(airlineData).sort((a,b) => b[1].cheapestCount - a[1].cheapestCount);
  const ctx2 = document.getElementById('chart-airline-cheapest');
  if (ctx2) {
    charts['airline-cheapest'] = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: sortedByCount.map(([k]) => k),
        datasets: [{ label: 'Times cheapest', data: sortedByCount.map(([,v]) => v.cheapestCount),
          backgroundColor: sortedByCount.map((_,i) => PALETTE[i % PALETTE.length] + 'cc'),
          borderRadius: 5, borderSkipped: false }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { font: { size: 11 } }, grid: { color: '#f3f4f6' } },
                  y: { ticks: { font: { size: 11 } }, grid: { display: false } } }
      }
    });
  }
}

// ── TABLE ─────────────────────────────────────────────────────────────────────

function renderTable(baseRows) {
  let rows = [...baseRows];

  // date filter
  if (activeTableDates.size > 0) rows = rows.filter(r => activeTableDates.has(r.depart_date));
  // airline filter
  if (tableAirline) rows = rows.filter(r => r.airlines.includes(tableAirline));
  // stops filter
  if (tableStops === 'direct') rows = rows.filter(r => r.out_stops === 0);
  else if (tableStops === '1') rows = rows.filter(r => r.out_stops === 1);
  else if (tableStops === '2') rows = rows.filter(r => r.out_stops >= 2);
  // flight search
  if (tableFlightSearch) {
    const q = tableFlightSearch.toLowerCase();
    rows = rows.filter(r => r.out_flight_nums.toLowerCase().includes(q) || r.airlines.toLowerCase().includes(q));
  }
  // sort
  if (tableSort === 'price') rows.sort((a,b) => a.price_eur - b.price_eur);
  else if (tableSort === 'depart') rows.sort((a,b) => a.depart_date.localeCompare(b.depart_date));
  else if (tableSort === 'week') rows.sort((a,b) => b.checked_at.localeCompare(a.checked_at));
  else if (tableSort === 'duration') rows.sort((a,b) => a.out_duration - b.out_duration);

  document.getElementById('table-count').textContent = `${rows.length} row${rows.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('offers-tbody');
  if (!tbody) return;

  tbody.innerHTML = rows.map(r => {
    const isDecJan = r.season === 'DecJan';
    const seasonPill = isDecJan
      ? '<span class="pill pill-dec">🎄 Dec/Jan</span>'
      : '<span class="pill pill-aug">☀ Aug</span>';

    let priceClass = 'price-normal';
    if (r.price_eur < 500) priceClass = 'price-low-text';
    else if (r.price_eur > 900) priceClass = 'price-high-text';

    let chgHtml = '<span class="chg-neu">—</span>';
    if (r.price_change_pct != null) {
      const pct = r.price_change_pct;
      if (pct > 1) chgHtml = `<span class="chg-up">▲ +${pct.toFixed(1)}%</span>`;
      else if (pct < -1) chgHtml = `<span class="chg-dn">▼ ${pct.toFixed(1)}%</span>`;
      else chgHtml = `<span class="chg-neu">${pct.toFixed(1)}%</span>`;
    }

    let stopsPill;
    if (r.out_stops === 0) stopsPill = '<span class="pill pill-direct">Direct</span>';
    else if (r.out_stops === 1) stopsPill = '<span class="pill pill-1stop">1 stop</span>';
    else stopsPill = `<span class="pill pill-2stop">${r.out_stops} stops</span>`;

    let retStopsPill = '<span style="color:var(--muted)">—</span>';
    if (r.ret_dep_time || r.ret_arr_time || r.ret_duration) {
      if (r.ret_stops === 0) retStopsPill = '<span class="pill pill-direct">Direct</span>';
      else if (r.ret_stops === 1) retStopsPill = '<span class="pill pill-1stop">1 stop</span>';
      else retStopsPill = `<span class="pill pill-2stop">${r.ret_stops} stops</span>`;
    }

    let flightNos = '—';
    if (r.out_flight_nums) {
      flightNos = r.out_flight_nums.split(',').map(f => `<span class="flight-chip">${f.trim()}</span>`).join('');
    }

    let duration = '—';
    if (r.out_duration_fmt) duration = r.out_duration_fmt;
    else if (r.out_duration) duration = fmtMins(r.out_duration);

    let layover = '—';
    if (r.out_layover_fmt) layover = r.out_layover_fmt;
    else if (r.out_layover_min) layover = fmtMins(r.out_layover_min);

    let retDuration = '—';
    if (r.ret_duration_fmt) retDuration = r.ret_duration_fmt;
    else if (r.ret_duration) retDuration = fmtMins(r.ret_duration);

    let retLayover = '—';
    if (r.ret_layover_fmt) retLayover = r.ret_layover_fmt;
    else if (r.ret_layover_min) retLayover = fmtMins(r.ret_layover_min);

    return `<tr>
      <td>${fmtDate(r.checked_at)}</td>
      <td>${seasonPill}</td>
      <td>${fmtDate(r.depart_date)}</td>
      <td>${fmtDate(r.return_date)}</td>
      <td class="${priceClass}">€${r.price_eur.toFixed(0)}</td>
      <td>${chgHtml}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis">${r.airlines}</td>
      <td>${flightNos}</td>
      <td>${stopsPill}</td>
      <td>${fmtTime(r.out_dep_time)}</td>
      <td>${fmtTime(r.out_arr_time)}</td>
      <td>${duration}</td>
      <td>${layover}</td>
      <td>${retStopsPill}</td>
      <td>${fmtTime(r.ret_dep_time)}</td>
      <td>${fmtTime(r.ret_arr_time)}</td>
      <td>${retDuration}</td>
      <td>${retLayover}</td>
    </tr>`;
  }).join('');
}

loadData();
