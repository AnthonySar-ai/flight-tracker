name: Weekly Flight Tracker

on:
  schedule:
    - cron: "0 8 * * 1,4"   # Every Monday and Thursday at 08:00 UTC
  workflow_dispatch:

jobs:
  track-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python flight_tracker.py

      - name: Generate Excel report
        run: python generate_report.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flights.csv data/flights.db data/flight_report.xlsx data/no_results.csv
          git diff --staged --quiet || git commit -m "data: update $(date -u +'%Y-%m-%d')"
          git push
